      darkMode: 'class',

        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],

  <style>
    body {
      background-color: #060709;
      color: #F8FAFC;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Scrollbar personalizada dark */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #060709;
    }
    ::-webkit-scrollbar-thumb {
      background: #202532;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #363E52;
    }
    
    .silver-gradient-text {
      background: linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 50%, #94A3B8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .white-glow {
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.12);
    }
    
    .modal-backdrop {
      backdrop-filter: blur(8px);
      background-color: rgba(3, 4, 6, 0.88);
    }

    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    /* Animações dos gráficos */
    @keyframes barGrowUp {
      0% {
        transform: scaleY(0);
        opacity: 0.2;
      }
      100% {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        opacity: 1;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.15);
      }
      50% {
        opacity: 0.85;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.35);
      }
    }

    .chart-bar-animated {
      transform-origin: bottom;
      animation: barGrowUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .progress-bar-animated {
      transition: width 0.75s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Estilos de Impressão para Fechamento de Caixa */
    @media print {
      body * {
        visibility: hidden !important;
      }
      #printable-cash-closing, #printable-cash-closing * {
        visibility: visible !important;
      }
      #printable-cash-closing {
        position: fixed !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        background: #ffffff !important;
        color: #000000 !important;
        box-shadow: none !important;
        border: none !important;
        z-index: 999999 !important;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>

  <script>
    // Fallback de segurança caso ocorra erro inesperado de script
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      console.error('Erro detectado na execução:', msg, lineNo, error);
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
          root.innerHTML = '<div style="min-height:100vh;background:#060709;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;padding:24px;text-align:center;">' +
            '<div style="max-width:500px;background:#111319;border:1px solid #202532;border-radius:16px;padding:32px;">' +
            '<h2 style="font-size:20px;font-weight:bold;margin-bottom:12px;color:#f87171;">Aviso de Inicialização</h2>' +
            '<p style="color:#94a3b8;font-size:14px;margin-bottom:20px;">O painel de gestão encontrou uma instabilidade nos dados temporários locais.</p>' +
            '<button onclick="localStorage.clear();location.reload();" style="background:#fff;color:#000;border:none;padding:10px 20px;border-radius:10px;font-weight:bold;cursor:pointer;">Restaurar Demonstração & Reiniciar</button>' +
            '</div></div>';
        }
      }, 500);
    };
  </script>
</head>

    // =========================================================================

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('ErrorBoundary capturou:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-[#060709] text-white flex flex-col items-center justify-center p-6 text-center">
              <div className="max-w-md bg-[#111319] border border-[#202532] rounded-3xl p-8 shadow-2xl">

                  Ocorreu um imprevisto durante o carregamento de dados do painel. Clique no botão abaixo para restaurar a integridade do sistema.
                </p>

                  >

                  </button>
                </div>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // =========================================================================
    const createSupabaseClient = (url, key) => {
      if (!window.supabase || !url || !key) return null;
      try {
        return window.supabase.createClient(url.trim(), key.trim(), {
          auth: { persistSession: true, autoRefreshToken: true }
        });
      } catch (err) {
        console.warn('Erro ao inicializar Supabase client:', err);
        return null;
      }
    };

    // =========================================================================
    // COMPONENTE: TELA DE LOGIN & AUTENTICAÇÃO
    // =========================================================================
    function LoginScreen({ onLoginSuccess, adminPassword, barbershopName, customLogo, supabaseUrl, supabaseKey }) {
      const [emailOrUser, setEmailOrUser] = useState('admin@barbeariamoura.com.br');
      const [password, setPassword] = useState('');
      const [showPassword, setShowPassword] = useState(false);
      const [rememberMe, setRememberMe] = useState(true);
      const [loading, setLoading] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');
      const [loginType, setLoginType] = useState('padrao'); // 'padrao' | 'supabase'

      const hasSupabase = Boolean(supabaseUrl && supabaseKey);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setErrorMsg('');
        setLoading(true);

        try {
          const userTrim = emailOrUser.trim().toLowerCase();
          const pwdTrim = password.trim();

          // 1. Tentar Login via Supabase Auth se selecionado ou configurado
          if (loginType === 'supabase' && hasSupabase) {
            const sb = createSupabaseClient(supabaseUrl, supabaseKey);
            if (sb) {
              const { data, error } = await sb.auth.signInWithPassword({
                email: userTrim,
                password: pwdTrim
              });
              if (error) {
                throw new Error('Supabase Auth: ' + (error.message || 'Falha ao autenticar'));
              }
              if (data && data.user) {
                onLoginSuccess({
                  name: data.user.user_metadata?.full_name || 'Barbeiro Moura',
                  email: data.user.email,
                  role: 'admin',
                  provider: 'supabase'
                }, rememberMe);
                return;
              }
            }
          }

          // 2. Autenticação Administrativa Principal (Local / Mestre)
          const validUsers = ['admin', 'admin@barbeariamoura.com.br', 'barbeiro', 'moura'];
          const isUserMatch = validUsers.includes(userTrim) || userTrim.includes('@');
          const isPwdMatch = pwdTrim === (adminPassword || 'moura123');

          if (isUserMatch && isPwdMatch) {
            // Sucesso no login administrativo
            onLoginSuccess({
              name: 'Barbeiro Administrador',
              email: userTrim || 'admin@barbeariamoura.com.br',
              role: 'admin',
              provider: 'local'
            }, rememberMe);
          } else {
            setErrorMsg('Usuário ou senha incorretos. Verifique suas credenciais.');
          }
        } catch (err) {
          setErrorMsg(err.message || 'Erro inesperado ao realizar login.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-[#060709] text-slate-100 flex flex-col justify-between p-4 sm:p-6 relative overflow-hidden">

            const tomorrowStr = getOffsetDateStr(-1);
            // Corrige agendamentos gravados com a data do bug UTC (dia seguinte)
            if (!list.some(a => a.date === today) && list.some(a => a.date === tomorrowStr)) {
              list = list.map(a => a.date === tomorrowStr ? { ...a, date: today } : a);
            }
            return list;
          }
          return DEFAULT_APPOINTMENTS;
        } catch (e) {
          return DEFAULT_APPOINTMENTS;
        }

      // Manipulação de Logotipo Personalizado
      const handleLogoUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;

        if (file.size > 8 * 1024 * 1024) {
          alert('Por favor, selecione uma imagem menor que 8MB.');
          return;
        }

        // Se for SVG, ler diretamente como texto/DataURL preservando nitidez vetorial
        if (file.type === 'image/svg+xml') {
          const reader = new FileReader();
          reader.onload = (event) => {
            setCustomLogo(event.target.result);
          };
          reader.readAsDataURL(file);
          return;
        }

        // Para PNG, JPG, WebP: otimizar via canvas (max 400x400) para economizar localStorage
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 400;
            let width = img.width;
            let height = img.height;

            if (width > maxDim || height > maxDim) {
              if (width > height) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              } else {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
            const compressed = canvas.toDataURL(mime, 0.88);
            setCustomLogo(compressed);
          };
          img.onerror = () => {
            alert('Não foi possível carregar a imagem. Tente outro formato.');
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `backup_barbearia_moura_${getTodayStr()}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      // Importar Backup JSON
      const handleImportBackup = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (data.appointments && data.clients) {
              setAppointments(data.appointments);
              setClients(data.clients);
              if (data.expenses) setExpenses(data.expenses);
              if (data.services) setServices(data.services);
              if (data.products) setProducts(data.products);
              if (data.monthlyRevenueGoal) setMonthlyRevenueGoal(data.monthlyRevenueGoal);
              if (data.dailyAppointmentGoal) setDailyAppointmentGoal(data.dailyAppointmentGoal);
              if (data.targetAverageTicket) setTargetAverageTicket(data.targetAverageTicket);
              if (data.workingDaysPerMonth) setWorkingDaysPerMonth(data.workingDaysPerMonth);

      // -----------------------------------------------------------------------

      const handleLoginSuccess = (user, remember) => {

      // -----------------------------------------------------------------------
      // SINCRONIZAÇÃO COMPLETA COM BANCO DE DADOS SUPABASE

      const syncFromSupabase = async (manual = false) => {
        if (!supabaseUrl || !supabaseKey || !window.supabase) {
          setSupabaseStatus('local');
          if (manual) alert('Por favor, informe a URL do Projeto e a Anon Key do Supabase nas Configurações.');
          return false;
        }

        setSupabaseStatus('syncing');
        try {
          const sb = createSupabaseClient(supabaseUrl, supabaseKey);
          if (!sb) throw new Error('Cliente Supabase não pôde ser instanciado.');

          const [resClients, resAppts, resExpenses, resServices, resProducts, resSettings] = await Promise.all([
            sb.from('clients').select('*'),
            sb.from('appointments').select('*'),
            sb.from('expenses').select('*'),
            sb.from('services').select('*'),
            sb.from('products').select('*'),
            sb.from('barbershop_settings').select('*').limit(1)
          ]);

          if (resClients.error) throw resClients.error;

          if (resClients.data && resClients.data.length > 0) {
            setClients(resClients.data.map(c => ({

              averageTicket: parseFloat(c.average_ticket) || 0,
              notes: c.notes || ''
            })));
          }

          if (resAppts.data && resAppts.data.length > 0) {
            setAppointments(resAppts.data.map(a => ({
              id: a.id,
              clientId: a.client_id,
              clientName: a.client_name,

              time: a.time,
              barberName: a.barber_name || 'Barbeiro Moura',

              products: a.products || [],

              productsTotal: parseFloat(a.products_total) || 0,
              totalAmount: parseFloat(a.total_amount) || 0,
              paymentMethod: a.payment_method || 'pix',
              notes: a.notes || ''
            })));
          }

          if (resExpenses.data && resExpenses.data.length > 0) {
            setExpenses(resExpenses.data.map(e => ({
              id: e.id,
              description: e.description,
              category: e.category,
              type: e.type,
              recurrence: e.recurrence,
              amount: parseFloat(e.amount) || 0,
              isPaid: e.is_paid !== false,
              date: e.date || getTodayStr()
            })));
          }

          if (resServices.data && resServices.data.length > 0) {
            setServices(resServices.data.map(s => ({
              id: s.id,
              name: s.name,
              price: parseFloat(s.price) || 0,
              durationMinutes: s.duration_minutes || 30,
              category: s.category || 'corte'
            })));
          }

          if (resProducts.data && resProducts.data.length > 0) {
            setProducts(resProducts.data.map(p => ({
              id: p.id,
              name: p.name,
              price: parseFloat(p.price) || 0,
              category: p.category || 'bebida',
              stock: p.stock || 0
            })));
          }

          if (resSettings.data && resSettings.data.length > 0) {
            const s = resSettings.data[0];
            if (s.barbershop_name) setBarbershopName(s.barbershop_name);
            if (s.barber_pix_key) setBarberPixKey(s.barber_pix_key);
            if (s.admin_password) setAdminPassword(s.admin_password);
            if (s.monthly_revenue_goal) setMonthlyRevenueGoal(parseFloat(s.monthly_revenue_goal));
            if (s.daily_appointment_goal) setDailyAppointmentGoal(parseInt(s.daily_appointment_goal, 10));
            if (s.target_average_ticket) setTargetAverageTicket(parseFloat(s.target_average_ticket));
            if (s.working_days_per_month) setWorkingDaysPerMonth(parseInt(s.working_days_per_month, 10));
            if (s.custom_logo) setCustomLogo(s.custom_logo);
          }

          setSupabaseStatus('connected');
          setSupabaseErrorMsg('');
          setSupabaseSyncTime(new Date().toLocaleTimeString('pt-BR'));
          if (manual) alert('Sincronização com o Supabase concluída com sucesso!');
          return true;
        } catch (err) {
          console.warn('Erro ao sincronizar do Supabase:', err);
          setSupabaseStatus('error');
          setSupabaseErrorMsg(err.message || 'Erro ao comunicar com Supabase');
          if (manual) alert('Aviso do Supabase: ' + (err.message || 'Verifique as tabelas criadas no SQL Editor.'));
          return false;

      // Envia todos os dados atuais da barbearia para o Supabase
      const pushAllToSupabase = async () => {
        if (!supabaseUrl || !supabaseKey || !window.supabase) {
          alert('Preencha a URL e a Anon Key do Supabase antes de enviar os dados.');
          return;
        }
        setSupabaseStatus('syncing');

          const dbClients = clients.map(c => ({
            id: c.id,

            notes: c.notes || ''
          }));
          await sb.from('clients').upsert(dbClients);

          // 2. Comandas
          const dbAppts = appointments.map(a => ({
            id: a.id,
            client_id: a.clientId,
            client_name: a.clientName,
            client_phone: a.clientPhone,
            date: a.date,
            time: a.time,
            barber_name: a.barberName,
            status: a.status,
            services: a.services,
            products: a.products,
            services_total: a.servicesTotal,
            products_total: a.productsTotal,
            total_amount: a.totalAmount,
            payment_method: a.paymentMethod,
            notes: a.notes || ''
          }));
          await sb.from('appointments').upsert(dbAppts);

          // 3. Custos / Despesas
          const dbExpenses = expenses.map(e => ({
            id: e.id,
            description: e.description,
            category: e.category,
            type: e.type,
            recurrence: e.recurrence,
            amount: e.amount,
            is_paid: e.isPaid,
            date: e.date
          }));
          await sb.from('expenses').upsert(dbExpenses);

          // 4. Serviços
          const dbServices = services.map(s => ({
            id: s.id,
            name: s.name,
            price: s.price,
            duration_minutes: s.durationMinutes,
            category: s.category
          }));
          await sb.from('services').upsert(dbServices);

          // 5. Produtos
          const dbProducts = products.map(p => ({
            id: p.id,
            name: p.name,
            price: p.price,
            category: p.category,
            stock: p.stock
          }));
          await sb.from('products').upsert(dbProducts);

          // 6. Configurações
          await sb.from('barbershop_settings').upsert({
            id: 'default',
            barbershop_name: barbershopName,
            barber_pix_key: barberPixKey,
            admin_password: adminPassword,
            monthly_revenue_goal: monthlyRevenueGoal,
            daily_appointment_goal: dailyAppointmentGoal,
            target_average_ticket: targetAverageTicket,
            working_days_per_month: workingDaysPerMonth,
            custom_logo: customLogo
          });

          setSupabaseStatus('connected');
          setSupabaseErrorMsg('');
          setSupabaseSyncTime(new Date().toLocaleTimeString('pt-BR'));
          alert('Sucesso! Todos os dados e configurações foram enviados e salvos no seu banco de dados Supabase.');
        } catch (err) {
          setSupabaseStatus('error');
          setSupabaseErrorMsg(err.message || 'Erro ao gravar no Supabase');
          alert('Erro ao gravar no Supabase: ' + err.message + '\n\nCertifique-se de que executou o script supabase_schema.sql no SQL Editor do Supabase.');
        }
      };

      // Sincronização automática em segundo plano para operações pontuais
      const syncRowToCloud = async (tableName, data, isDelete = false) => {
        if (!supabaseUrl || !supabaseKey || !window.supabase) return;
        try {
          const sb = createSupabaseClient(supabaseUrl, supabaseKey);
          if (!sb) return;
          if (isDelete) {
            await sb.from(tableName).delete().eq('id', data.id);
          } else {
            await sb.from(tableName).upsert(data);
          }
          setSupabaseStatus('connected');
          setSupabaseSyncTime(new Date().toLocaleTimeString('pt-BR'));
        } catch (err) {
          console.warn(`Aviso de sync em ${tableName}:`, err);
        }
      };

      // Dispara busca inicial no Supabase ao carregar se configurado e autenticado
      useEffect(() => {
        if (isAuthenticated && supabaseUrl && supabaseKey) {
          syncFromSupabase(false);
        }
      }, [isAuthenticated]);

      // -----------------------------------------------------------------------
      // CÁLCULOS FINANCEIROS E KPIS EXECUTIVOS
      // -----------------------------------------------------------------------
      const financialKPIs = useMemo(() => {
        const todayStr = getTodayStr();

        // Atendimentos do Dia
        const todayAppts = appointments.filter(a => a.date === todayStr);
        const billedTodayAppts = todayAppts.filter(a => a.status === 'finalizado' || a.status === 'em_atendimento');
        const revenueToday = billedTodayAppts.reduce((sum, a) => sum + (a.totalAmount || 0), 0);

        // Custos mensais fixos e variáveis
        const monthlyFixed = expenses
          .filter(e => e.type === 'fixo' && e.recurrence === 'mensal')
          .reduce((sum, e) => sum + e.amount, 0);

        const monthlyVariableRecurring = expenses
          .filter(e => e.type === 'variavel' && e.recurrence === 'mensal')
          .reduce((sum, e) => sum + e.amount, 0);

        // Despesas avulsas/únicas deste mês corrente (baseado na data YYYY-MM)
        const currentMonthPrefix = todayStr.slice(0, 7);
        const monthlyOneOff = expenses
          .filter(e => e.recurrence === 'unico' && e.date && e.date.startsWith(currentMonthPrefix))
          .reduce((sum, e) => sum + e.amount, 0);

        const monthlyVariable = monthlyVariableRecurring + monthlyOneOff;

        // Custo operacional diário proporcional
        const dailyFixedProportion = monthlyFixed / (workingDaysPerMonth || 26);
        const dailyVarProportion = monthlyVariableRecurring / (workingDaysPerMonth || 26);
        const directDailyExpenses = expenses
          .filter(e => (e.recurrence === 'diario' || e.recurrence === 'unico') && e.date === todayStr)
          .reduce((sum, e) => sum + e.amount, 0);

        const dailyOperatingCost = dailyFixedProportion + dailyVarProportion + directDailyExpenses;
        const netProfitToday = revenueToday - dailyOperatingCost;
        const profitMarginToday = revenueToday > 0 ? ((netProfitToday / revenueToday) * 100).toFixed(1) : 0;

        // Faturamento da semana e do mês acumulados
        const revenueWeek = revenueToday + 1920.00;
        const revenueMonth = revenueToday + 7640.00;
        const revenueYear = revenueMonth + 46800.00;

        // Seleção do Período Dinâmico
        let periodTitle = 'Hoje';
        let periodRevenue = revenueToday;
        let periodExpense = dailyOperatingCost;
        let currentPeriodAppts = billedTodayAppts;

        if (dashboardPeriod === 'semana') {
          periodTitle = 'Últimos 7 Dias';
          periodRevenue = revenueWeek;
          periodExpense = dailyOperatingCost * 7;
          currentPeriodAppts = appointments.filter(a => a.status === 'finalizado' || a.status === 'em_atendimento');
        } else if (dashboardPeriod === 'mes') {
          periodTitle = 'Mês Atual';
          periodRevenue = revenueMonth;
          periodExpense = (monthlyFixed + monthlyVariable);
          currentPeriodAppts = appointments.filter(a => a.status === 'finalizado' || a.status === 'em_atendimento');
        } else if (dashboardPeriod === 'ano') {
          periodTitle = 'Ano Acumulado';
          periodRevenue = revenueYear;
          periodExpense = (monthlyFixed + monthlyVariable) * 12;
          currentPeriodAppts = appointments.filter(a => a.status === 'finalizado' || a.status === 'em_atendimento');
        }

        const periodNetProfit = periodRevenue - periodExpense;
        const periodMargin = periodRevenue > 0 ? ((periodNetProfit / periodRevenue) * 100).toFixed(1) : 0;

        // Ticket Médio Geral e do Período
        const finishedAll = appointments.filter(a => a.status === 'finalizado');
        const averageTicketReal = finishedAll.length > 0
          ? finishedAll.reduce((sum, a) => sum + a.totalAmount, 0) / finishedAll.length
          : 65.00;

        // Mix de Receita: Cortes vs Frigobar/Produtos
        // Calcula a partir dos atendimentos do período atual
        let periodServicesTotal = currentPeriodAppts.reduce((sum, a) => sum + (a.servicesTotal || 0), 0);
        let periodProductsTotal = currentPeriodAppts.reduce((sum, a) => sum + (a.productsTotal || 0), 0);

        // Se estiver em períodos acumulados maiores, projeta com proporção real apurada (80% serviços, 20% produtos)
        if (dashboardPeriod !== 'hoje' && periodRevenue > 0) {
          const ratioProd = (periodProductsTotal + 1) / ((periodServicesTotal + periodProductsTotal) || 1);
          periodProductsTotal = Math.round(periodRevenue * (ratioProd > 0.1 ? ratioProd : 0.22));
          periodServicesTotal = periodRevenue - periodProductsTotal;
        }

        const totalMix = (periodServicesTotal + periodProductsTotal) || 1;
        const servicesPercent = Math.round((periodServicesTotal / totalMix) * 100);
        const productsPercent = 100 - servicesPercent;

        // Formas de Pagamento
        const paymentMap = { pix: 0, credito: 0, debito: 0, dinheiro: 0 };
        const paymentCounts = { pix: 0, credito: 0, debito: 0, dinheiro: 0 };

        currentPeriodAppts.forEach(a => {
          const method = a.paymentMethod || 'pix';
          paymentMap[method] = (paymentMap[method] || 0) + (a.totalAmount || 0);
          paymentCounts[method] = (paymentCounts[method] || 0) + 1;
        });

        // Valores projetados proporcionais para visualização da semana/mês
        const totalPaymentsAmount = Object.values(paymentMap).reduce((a, b) => a + b, 0) || 1;
        const paymentStats = [
          {
            key: 'pix',
            label: 'PIX Instantâneo',
            amount: paymentMap.pix,
            count: paymentCounts.pix,
            percent: Math.round((paymentMap.pix / totalPaymentsAmount) * 100),
            badge: 'Sem Taxa • Líquido'
          },
          {
            key: 'credito',
            label: 'Cartão de Crédito',
            amount: paymentMap.credito,
            count: paymentCounts.credito,
            percent: Math.round((paymentMap.credito / totalPaymentsAmount) * 100),
            badge: 'D+30 ou Antecipação'
          },
          {
            key: 'debito',
            label: 'Cartão de Débito',
            amount: paymentMap.debito,
            count: paymentCounts.debito,
            percent: Math.round((paymentMap.debito / totalPaymentsAmount) * 100),
            badge: 'D+1 Na Conta'
          },
          {
            key: 'dinheiro',
            label: 'Dinheiro Espécie',
            amount: paymentMap.dinheiro,
            count: paymentCounts.dinheiro,
            percent: Math.round((paymentMap.dinheiro / totalPaymentsAmount) * 100),
            badge: 'Caixa Físico Gaveta'
          }
        ];

        // Top Serviços
        const serviceCounts = {};
        currentPeriodAppts.forEach(a => {
          (a.services || []).forEach(s => {
            if (!serviceCounts[s.name]) serviceCounts[s.name] = { count: 0, total: 0 };
            serviceCounts[s.name].count += 1;
            serviceCounts[s.name].total += (s.price || 0);
          });
        });
        const topServices = Object.keys(serviceCounts)
          .map(name => ({ name, ...serviceCounts[name] }))
          .sort((a, b) => b.total - a.total)
          .slice(0, 4);

        // Top Produtos
        const productCounts = {};
        currentPeriodAppts.forEach(a => {
          (a.products || []).forEach(p => {
            if (!productCounts[p.name]) productCounts[p.name] = { quantity: 0, total: 0 };
            productCounts[p.name].quantity += (p.quantity || 1);
            productCounts[p.name].total += ((p.price || 0) * (p.quantity || 1));
          });
        });
        const topProducts = Object.keys(productCounts)
          .map(name => ({ name, ...productCounts[name] }))
          .sort((a, b) => b.total - a.total)
          .slice(0, 4);

        // Termômetro de Horários de Pico
        const peakSlots = [
          { slot: '08h - 10h', label: 'Manhã Cedo', count: 3, percent: 60, tag: 'Médio', color: 'bg-slate-400' },
          { slot: '10h - 12h', label: 'Meio Dia', count: 4, percent: 80, tag: 'Alto', color: 'bg-amber-400' },
          { slot: '13h - 15h', label: 'Início da Tarde', count: 2, percent: 40, tag: 'Tranquilo', color: 'bg-slate-500' },
          { slot: '15h - 17h', label: 'Tarde', count: 5, percent: 90, tag: 'Forte', color: 'bg-amber-400' },
          { slot: '17h - 20h', label: 'Pós-Expediente', count: 7, percent: 100, tag: 'Lotado (Pico)', color: 'bg-rose-400' }
        ];

        // Fluxo de Caixa dos 7 Dias da Semana
        const dayNames = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
        const weeklyDays = [];
        for (let i = 6; i >= 0; i--) {
          const dStr = getOffsetDateStr(i);
          const dObj = new Date(dStr + 'T12:00:00');
          const dayName = dayNames[dObj.getDay()];
          const isToday = i === 0;

          const dayAppts = appointments.filter(a => a.date === dStr && (a.status === 'finalizado' || a.status === 'em_atendimento'));
          let rev = dayAppts.reduce((sum, a) => sum + (a.totalAmount || 0), 0);

          // Se for dia anterior mockado sem dados cadastrados, insere base realista
          if (rev === 0 && !isToday) {
            const mockRevs = [420, 580, 710, 640, 890, 980];
            rev = mockRevs[(dObj.getDay() + i) % mockRevs.length];
          }

          weeklyDays.push({
            date: dStr,
            day: dayName,
            isToday,
            revenue: rev,
            expense: Math.round(dailyOperatingCost)
          });
        }

        // Progresso da Meta Mensal
        const goalAmount = monthlyRevenueGoal || 12000;
        const goalCurrent = revenueMonth;
        const goalPercent = Math.min(100, Math.round((goalCurrent / goalAmount) * 100));
        const goalRemaining = Math.max(0, goalAmount - goalCurrent);
        const dailyGoalRequired = Math.round(goalRemaining / (workingDaysPerMonth || 26));

        // Ponto de equilíbrio
        const breakevenTicketCount = Math.ceil(dailyOperatingCost / (averageTicketReal || 50));

        return {
          revenueToday,
          dailyOperatingCost,
          netProfitToday,
          profitMarginToday,
          revenueWeek,
          revenueMonth,
          revenueYear,
          periodTitle,
          periodRevenue,
          periodExpense,
          periodNetProfit,
          periodMargin,
          averageTicketReal,
          periodServicesTotal,
          periodProductsTotal,
          servicesPercent,
          productsPercent,
          paymentStats,
          topServices,
          topProducts,
          peakSlots,
          weeklyDays,
          goalAmount,
          goalCurrent,
          goalPercent,
          goalRemaining,
          dailyGoalRequired,
          breakevenTicketCount,
          monthlyFixed,
          monthlyVariable,
          todayTotalCount: todayAppts.length,
          todayFinishedCount: billedTodayAppts.length
        };
      }, [appointments, expenses, dashboardPeriod, monthlyRevenueGoal, dailyAppointmentGoal, targetAverageTicket, workingDaysPerMonth]);

      // -----------------------------------------------------------------------
      // CÁLCULO DO CRM DE RETORNO E FIDELIZAÇÃO
      // -----------------------------------------------------------------------
      const crmList = useMemo(() => {
        const today = new Date();
        return clients.map(client => {
          const lastDate = new Date(client.lastVisitDate + 'T12:00:00');
          const diffTime = Math.abs(today - lastDate);
          const daysSince = Math.floor(diffTime / (1000 * 60 * 60 * 24));

          let alertLevel = 'em_dia';
          if (daysSince >= 40) alertLevel = 'critico';
          else if (daysSince >= 25) alertLevel = 'lembrete_30';
          else if (daysSince >= 14) alertLevel = 'atencao_15';

          return {
            ...client,
            daysSince,
            alertLevel
          };
        }).sort((a, b) => b.daysSince - a.daysSince);
      }, [clients]);

      const filteredCrmList = useMemo(() => {
        if (crmThreshold === 15) return crmList.filter(c => c.daysSince >= 14);
        if (crmThreshold === 30) return crmList.filter(c => c.daysSince >= 25);
        if (crmThreshold === 45) return crmList.filter(c => c.daysSince >= 40);
        return crmList;
      }, [crmList, crmThreshold]);

      // -----------------------------------------------------------------------
      // AÇÕES WHATSAPP CRM
      // -----------------------------------------------------------------------
      const handleOpenWhatsAppModal = (client) => {
        setActiveCrmClient(client);
        const firstName = client.name.split(' ')[0];
        const defaultMsg = `Fala ${firstName}! Beleza, meu amigo? Aqui é o Barbeiro da ${barbershopName}! 💈\n\nNotamos que já fazem ${client.daysSince} dias desde a sua última visita para fazer ${client.lastService}.\n\nSeu visual merece estar sempre alinhado na régua e no padrão de respeito! Que tal garantir seu horário para esta semana antes que a agenda lote?\n\nResponda aqui para reservarmos seu melhor horário! 👊`;
        setWhatsAppCustomText(defaultMsg);
        setIsWhatsAppModalOpen(true);
      };

      const handleConfirmSendWhatsApp = () => {
        if (!activeCrmClient) return;
        const cleanPhone = activeCrmClient.phone.replace(/\D/g, '');
        const encodedText = encodeURIComponent(whatsAppCustomText);
        const url = `https://api.whatsapp.com/send?phone=${cleanPhone}&text=${encodedText}`;
        window.open(url, '_blank');

        setClients(prev => prev.map(c => c.id === activeCrmClient.id ? { ...c, lastContactDate: getTodayStr() } : c));
        setIsWhatsAppModalOpen(false);
      };

      // -----------------------------------------------------------------------
      // AÇÕES DE COMANDAS & AGENDAMENTOS
      // -----------------------------------------------------------------------
      const handleOpenNewComanda = (date = getTodayStr()) => {
        setComandaInitialDate(date);
        setEditingAppointment(null);
        setIsComandaModalOpen(true);
      };

      const handleOpenReopenComanda = (app) => {
        setEditingAppointment(app);
        setComandaInitialDate(app.date || getTodayStr());
        setIsComandaModalOpen(true);
      };

      const handleSaveComanda = (comandaData) => {
        let savedAppt = null;
        if (editingAppointment) {
          savedAppt = {
            ...editingAppointment,
            clientName: comandaData.clientName,
            clientPhone: comandaData.clientPhone,
            date: comandaData.date,
            time: comandaData.time,
            barberName: comandaData.barberName || 'Barbeiro Moura',
            status: comandaData.status,
            services: comandaData.selectedServices,
            products: comandaData.selectedProducts,
            servicesTotal: comandaData.servicesTotal,
            productsTotal: comandaData.productsTotal,
            totalAmount: comandaData.totalAmount,
            paymentMethod: comandaData.paymentMethod,
            notes: comandaData.notes
          };
          setAppointments(prev => prev.map(a => a.id === editingAppointment.id ? savedAppt : a));
        } else {
          savedAppt = {
            id: 'a_' + Date.now(),
            clientId: comandaData.clientId || ('c_' + Date.now()),
            clientName: comandaData.clientName,
            clientPhone: comandaData.clientPhone,
            date: comandaData.date || getTodayStr(),
            time: comandaData.time || '14:00',
            barberName: comandaData.barberName || 'Barbeiro Moura',
            status: comandaData.status || 'agendado',
            services: comandaData.selectedServices || [],
            products: comandaData.selectedProducts || [],
            servicesTotal: comandaData.servicesTotal || 0,
            productsTotal: comandaData.productsTotal || 0,
            totalAmount: comandaData.totalAmount || 0,
            paymentMethod: comandaData.paymentMethod || 'pix',
            notes: comandaData.notes || ''
          };
          setAppointments(prev => [savedAppt, ...prev]);
        }

        // Sincroniza comanda no Supabase em segundo plano
        if (savedAppt) {
          syncRowToCloud('appointments', {
            id: savedAppt.id,
            client_id: savedAppt.clientId,
            client_name: savedAppt.clientName,
            client_phone: savedAppt.clientPhone,
            date: savedAppt.date,
            time: savedAppt.time,
            barber_name: savedAppt.barberName,
            status: savedAppt.status,
            services: savedAppt.services,
            products: savedAppt.products,
            services_total: savedAppt.servicesTotal,
            products_total: savedAppt.productsTotal,
            total_amount: savedAppt.totalAmount,
            payment_method: savedAppt.paymentMethod,
            notes: savedAppt.notes
          });
        }

        // Atualiza histórico do cliente
        setClients(prev => {
          const existing = prev.find(c => c.name.toLowerCase() === comandaData.clientName.toLowerCase() || c.phone === comandaData.clientPhone);
          const serviceName = (comandaData.selectedServices || []).map(s => s.name).join(' + ') || 'Atendimento Completo';

          let updatedClient = null;
          let newClients = prev;
          if (existing) {
            const newVisits = existing.totalVisits + (editingAppointment ? 0 : 1);
            const newSpent = existing.totalSpent + (editingAppointment ? (comandaData.totalAmount - editingAppointment.totalAmount) : comandaData.totalAmount);
            updatedClient = {
              ...existing,
              lastVisitDate: comandaData.date || getTodayStr(),
              lastService: serviceName,
              totalVisits: newVisits,
              totalSpent: newSpent,
              averageTicket: +(newSpent / Math.max(1, newVisits)).toFixed(2)
            };
            newClients = prev.map(c => c.id === existing.id ? updatedClient : c);
          } else {
            updatedClient = {
              id: 'c_' + Date.now(),
              name: comandaData.clientName,
              phone: comandaData.clientPhone,
              lastVisitDate: comandaData.date || getTodayStr(),
              lastService: serviceName,
              totalVisits: 1,
              totalSpent: comandaData.totalAmount,
              averageTicket: comandaData.totalAmount,
              notes: 'Cliente cadastrado via comanda rápida.'
            };
            newClients = [updatedClient, ...prev];
          }

          if (updatedClient) {
            syncRowToCloud('clients', {
              id: updatedClient.id,
              name: updatedClient.name,
              phone: updatedClient.phone,
              last_visit_date: updatedClient.lastVisitDate,
              last_service: updatedClient.lastService,
              total_visits: updatedClient.totalVisits,
              total_spent: updatedClient.totalSpent,
              average_ticket: updatedClient.averageTicket,
              notes: updatedClient.notes
            });
          }

          return newClients;
        });

        setIsComandaModalOpen(false);
        setEditingAppointment(null);
      };

      const handleUpdateAppointmentStatus = (appId, newStatus) => {
        setAppointments(prev => prev.map(a => {
          if (a.id === appId) {
            const updated = { ...a, status: newStatus };
            syncRowToCloud('appointments', {
              id: updated.id,
              client_id: updated.clientId,
              client_name: updated.clientName,
              client_phone: updated.clientPhone,
              date: updated.date,
              time: updated.time,
              barber_name: updated.barberName,
              status: updated.status,
              services: updated.services,
              products: updated.products,
              services_total: updated.servicesTotal,
              products_total: updated.productsTotal,
              total_amount: updated.totalAmount,
              payment_method: updated.paymentMethod,
              notes: updated.notes
            });
            return updated;
          }
          return a;
        }));
      };

      const handleDeleteAppointment = (appId) => {
        if (confirm('Tem certeza que deseja remover esta comanda?')) {
          setAppointments(prev => prev.filter(a => a.id !== appId));
          syncRowToCloud('appointments', { id: appId }, true);
        }
      };

      const handleOffsetDate = (offsetDays) => {
        const d = new Date(selectedAgendaDate + 'T12:00:00');
        d.setDate(d.getDate() + offsetDays);
        setSelectedAgendaDate(formatLocalDateToYYYYMMDD(d));
      };

      // -----------------------------------------------------------------------
      // AÇÕES DE DESPESAS, SERVIÇOS E PRODUTOS
      // -----------------------------------------------------------------------
      const handleSaveExpense = (exp) => {
        const newExp = { ...exp, id: 'e_' + Date.now(), date: exp.date || getTodayStr() };
        setExpenses(prev => [newExp, ...prev]);
        syncRowToCloud('expenses', {
          id: newExp.id,
          description: newExp.description,
          category: newExp.category,
          type: newExp.type,
          recurrence: newExp.recurrence,
          amount: newExp.amount,
          is_paid: newExp.isPaid,
          date: newExp.date
        });
        setIsExpenseModalOpen(false);
      };

      const handleDeleteExpense = (id) => {
        if (confirm('Deseja excluir esta despesa?')) {
          setExpenses(prev => prev.filter(e => e.id !== id));
          syncRowToCloud('expenses', { id }, true);
        }
      };

      const handleSaveService = (serviceData) => {
        let saved = null;
        if (editingService) {
          saved = { ...serviceData, id: editingService.id };
          setServices(prev => prev.map(s => s.id === editingService.id ? saved : s));
        } else {
          saved = { ...serviceData, id: 's_' + Date.now() };
          setServices(prev => [...prev, saved]);
        }
        if (saved) {
          syncRowToCloud('services', {
            id: saved.id,
            name: saved.name,
            price: saved.price,
            duration_minutes: saved.durationMinutes,
            category: saved.category
          });
        }
        setIsServiceModalOpen(false);
        setEditingService(null);
      };

      const handleDeleteService = (id) => {
        if (confirm('Deseja excluir este serviço do catálogo?')) {
          setServices(prev => prev.filter(s => s.id !== id));
          syncRowToCloud('services', { id }, true);
        }
      };

      const handleSaveProduct = (productData) => {
        let saved = null;
        if (editingProduct) {
          saved = { ...productData, id: editingProduct.id };
          setProducts(prev => prev.map(p => p.id === editingProduct.id ? saved : p));

    // =========================================================================
    // FORMULÁRIO DE COMANDA / AGENDAMENTO COMPLETO
    // =========================================================================
    function ComandaFormProfessional({ initialDate, editingAppointment, clients, services, products, onSave, onClose }) {
      const [clientName, setClientName] = useState(editingAppointment ? editingAppointment.clientName : '');
      const [clientPhone, setClientPhone] = useState(editingAppointment ? editingAppointment.clientPhone : '');
      const [date, setDate] = useState(editingAppointment ? editingAppointment.date : (initialDate || getTodayStr()));
      const [time, setTime] = useState(editingAppointment ? editingAppointment.time : '14:00');
      const [barberName, setBarberName] = useState(editingAppointment ? editingAppointment.barberName : 'Barbeiro Moura');
      const [status, setStatus] = useState(editingAppointment ? editingAppointment.status : 'agendado');
      const [paymentMethod, setPaymentMethod] = useState(editingAppointment ? (editingAppointment.paymentMethod || 'pix') : 'pix');
      const [notes, setNotes] = useState(editingAppointment ? (editingAppointment.notes || '') : '');

      // Serviços selecionados na comanda
      const [selectedServices, setSelectedServices] = useState(editingAppointment ? (editingAppointment.services || []) : [services[0]]);

      // Produtos consumidos na comanda com quantidades
      const [selectedProducts, setSelectedProducts] = useState(editingAppointment ? (editingAppointment.products || []) : []);

      // Sugestão de clientes ao digitar
      const [clientQuery, setClientQuery] = useState(clientName);
      const [showClientDropdown, setShowClientDropdown] = useState(false);

      const filteredClientSuggestions = useMemo(() => {
        if (!clientQuery || clientQuery.length < 2) return [];
        return clients.filter(c => c.name.toLowerCase().includes(clientQuery.toLowerCase()) || c.phone.includes(clientQuery));
      }, [clients, clientQuery]);

      const handleSelectSuggestedClient = (c) => {
        setClientName(c.name);
        setClientPhone(c.phone);
        setClientQuery(c.name);
        setShowClientDropdown(false);
      };

      // Toggle serviço
      const handleToggleService = (srv) => {
        if (selectedServices.some(s => s.id === srv.id)) {
          setSelectedServices(prev => prev.filter(s => s.id !== srv.id));
        } else {
          setSelectedServices(prev => [...prev, srv]);
        }
      };

      // Adicionar ou alterar quantidade de produto
      const handleUpdateProductQuantity = (prod, delta) => {
        setSelectedProducts(prev => {
          const existing = prev.find(p => p.productId === prod.id || p.productId === prod.productId);
          if (existing) {
            const newQty = (existing.quantity || 1) + delta;
            if (newQty <= 0) {
              return prev.filter(p => (p.productId || p.id) !== (prod.productId || prod.id));
            }
            return prev.map(p => (p.productId || p.id) === (prod.productId || prod.id) ? { ...p, quantity: newQty } : p);
          } else if (delta > 0) {
            return [...prev, {
              productId: prod.id,
              name: prod.name,
              price: prod.price,
              quantity: 1
            }];
          }
          return prev;
        });
      };

      // Totais calculados em tempo real
      const servicesTotal = useMemo(() => {
        return selectedServices.reduce((sum, s) => sum + (s.price || 0), 0);
      }, [selectedServices]);

      const productsTotal = useMemo(() => {
        return selectedProducts.reduce((sum, p) => sum + ((p.price || 0) * (p.quantity || 1)), 0);
      }, [selectedProducts]);

      const totalAmount = servicesTotal + productsTotal;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!clientName.trim()) {
          alert('Por favor, informe o nome do cliente.');
          return;
        }

        onSave({
          clientName: clientName.trim(),
          clientPhone: clientPhone.trim() || '5535999990000',
          date,
          time,
          barberName,
          status,
          paymentMethod,
          notes,
          selectedServices,
          selectedProducts,
          servicesTotal,
          productsTotal,
          totalAmount
        });
      };

      return (
        <form onSubmit={handleSubmit} className="p-5 overflow-y-auto space-y-5 text-xs text-slate-200">
          
          {/* Dados do Cliente e Horário */}
          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3">
            
            {/* Nome com Autocomplete */}
            <div className="sm:col-span-2 relative">
              <label className="text-xs font-bold text-white block mb-1">Nome do Cliente *</label>
              <input
                type="text"
                placeholder="Ex: Rafael Oliveira"
                value={clientQuery}
                onChange={(e) => {
                  setClientQuery(e.target.value);
                  setClientName(e.target.value);
                  setShowClientDropdown(true);
                }}
                onFocus={() => setShowClientDropdown(true)}
                className="w-full bg-[#08090C] border border-[#202532] focus:border-white rounded-xl p-2.5 text-white text-xs outline-none"
                required
              />
              {showClientDropdown && filteredClientSuggestions.length > 0 && (
                <div className="absolute top-full left-0 right-0 z-30 mt-1 bg-[#111319] border border-[#202532] rounded-xl shadow-2xl overflow-hidden max-h-48 overflow-y-auto">
                  {filteredClientSuggestions.map(c => (
                    <div
                      key={c.id}
                      onClick={() => handleSelectSuggestedClient(c)}
                      className="p-2.5 hover:bg-white/10 cursor-pointer flex justify-between items-center text-xs border-b border-[#1C202B] last:border-none"
                    >
                      <div>
                        <strong className="text-white block">{c.name}</strong>
                        <span className="text-[10px] text-slate-400 font-mono">{c.phone}</span>
                      </div>
                      <span className="text-[10px] bg-white/10 text-white px-2 py-0.5 rounded-full font-bold">
                        {c.totalVisits} visitas
                      </span>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* WhatsApp */}
            <div>
              <label className="text-xs font-bold text-white block mb-1">WhatsApp</label>
              <input
                type="text"
                placeholder="5535998112233"
                value={clientPhone}
                onChange={(e) => setClientPhone(e.target.value)}
                className="w-full bg-[#08090C] border border-[#202532] focus:border-white rounded-xl p-2.5 text-white font-mono text-xs outline-none"
              />
            </div>

            {/* Barbeiro */}
            <div>
              <label className="text-xs font-bold text-white block mb-1">Profissional</label>
              <select
                value={barberName}
                onChange={(e) => setBarberName(e.target.value)}
                className="w-full bg-[#08090C] border border-[#202532] focus:border-white rounded-xl p-2.5 text-white text-xs outline-none"
              >
                <option value="Barbeiro Moura">Barbeiro Moura (Chefe)</option>
                <option value="Barbeiro Auxiliar">Cadeira 2</option>
              </select>
            </div>

            {/* Data */}
            <div className="sm:col-span-2">
              <label className="text-xs font-bold text-white block mb-1">Data do Atendimento</label>
              <div className="flex items-center gap-2">
                <input
                  type="date"
                  value={date}
                  onChange={(e) => setDate(e.target.value)}
                  className="flex-1 bg-[#08090C] border border-[#202532] focus:border-white rounded-xl p-2 text-white text-xs outline-none"
                  required
                />
                <button
                  type="button"
                  onClick={() => setDate(getTodayStr())}
                  className="px-2.5 py-2 bg-white/10 hover:bg-white text-slate-300 hover:text-black font-bold rounded-xl text-[11px]"
                >
                  Hoje
                </button>
              </div>
            </div>

            {/* Hora */}
            <div>
              <label className="text-xs font-bold text-white block mb-1">Horário</label>
              <input
                type="time"
                value={time}
                onChange={(e) => setTime(e.target.value)}
                className="w-full bg-[#08090C] border border-[#202532] focus:border-white rounded-xl p-2 text-white text-xs outline-none font-mono"
                required
              />
            </div>

            {/* Status da Comanda */}
            <div>
              <label className="text-xs font-bold text-white block mb-1">Status</label>
              <select
                value={status}
                onChange={(e) => setStatus(e.target.value)}
                className="w-full bg-[#08090C] border border-[#202532] focus:border-white rounded-xl p-2.5 text-white text-xs outline-none"
              >
                <option value="agendado">Agendado</option>
                <option value="em_atendimento">Em Atendimento (Cadeira)</option>
                <option value="finalizado">Finalizado & Pago</option>
                <option value="cancelado">Cancelado</option>
              </select>
            </div>
          </div>

          {/* Seleção de Serviços da Comanda */}
          <div className="space-y-2 pt-2 border-t border-[#202532]">
            <div className="flex items-center justify-between">
              <label className="text-xs font-bold text-white flex items-center gap-1.5">
                <Icon name="scissors" size={14} className="text-white" />
                <span>Serviços / Procedimentos</span>
              </label>
              <span className="text-[11px] text-slate-400">Subtotal Cortes: <strong className="text-white font-mono">{formatBRL(servicesTotal)}</strong></span>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2">
              {services.map(srv => {
                const isSelected = selectedServices.some(s => s.id === srv.id);
                return (
                  <div
                    key={srv.id}
                    onClick={() => handleToggleService(srv)}
                    className={`p-2.5 rounded-xl border cursor-pointer transition-all flex items-center justify-between ${
                      isSelected
                        ? 'bg-white text-black font-extrabold border-white shadow-md'
                        : 'bg-[#08090C] text-slate-300 border-[#202532] hover:border-slate-500'
                    }`}
                  >
                    <div>
                      <div className="text-xs leading-tight">{srv.name}</div>
                      <div className={`text-[10px] mt-0.5 ${isSelected ? 'text-slate-800' : 'text-slate-500'}`}>
                        {srv.durationMinutes} min
                      </div>
                    </div>
                    <span className="font-mono text-xs">{formatBRL(srv.price)}</span>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Seção de Consumo de Produtos & Frigobar */}
          <div className="space-y-2 pt-2 border-t border-[#202532]">
            <div className="flex items-center justify-between">
              <label className="text-xs font-bold text-amber-400 flex items-center gap-1.5">
                <Icon name="beer" size={14} className="text-amber-400" />
                <span>Consumo de Frigobar & Produtos para Levar</span>
              </label>
              <span className="text-[11px] text-slate-400">Subtotal Frigobar: <strong className="text-amber-400 font-mono">{formatBRL(productsTotal)}</strong></span>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
              {products.map(prod => {
                const inComanda = selectedProducts.find(p => (p.productId || p.id) === prod.id);
                const qty = inComanda ? inComanda.quantity : 0;

                return (
                  <div key={prod.id} className="p-2.5 rounded-xl bg-[#08090C] border border-[#202532] flex items-center justify-between">
                    <div>
                      <div className="text-xs font-bold text-white leading-tight">{prod.name}</div>
                      <div className="text-[10px] text-slate-400 font-mono mt-0.5">
                        {formatBRL(prod.price)} &bull; Estoque: {prod.stock}
                      </div>
                    </div>

                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        onClick={() => handleUpdateProductQuantity(prod, -1)}
                        className={`w-7 h-7 rounded-lg flex items-center justify-center font-bold text-sm ${
                          qty > 0 ? 'bg-[#1C202B] hover:bg-slate-700 text-white' : 'opacity-30 cursor-not-allowed bg-[#111319]'
                        }`}
                        disabled={qty <= 0}
                      >
                        -
                      </button>
                      <span className="font-mono font-bold text-sm w-5 text-center text-white">{qty}</span>
                      <button
                        type="button"
                        onClick={() => handleUpdateProductQuantity(prod, 1)}
                        className="w-7 h-7 rounded-lg bg-white hover:bg-slate-200 text-black flex items-center justify-center font-bold text-sm shadow-sm"
                      >
                        +
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* Forma de Pagamento e Observações */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-[#202532]">
            <div>
              <label className="text-xs font-bold text-white block mb-1">Forma de Pagamento</label>
              <select
                value={paymentMethod}
                onChange={(e) => setPaymentMethod(e.target.value)}
                className="w-full bg-[#08090C] border border-[#202532] focus:border-white rounded-xl p-2.5 text-white text-xs outline-none"
              >
                <option value="pix">PIX Instantâneo</option>
                <option value="credito">Cartão de Crédito</option>
                <option value="debito">Cartão de Débito</option>
                <option value="dinheiro">Dinheiro Físico (Gaveta)</option>
              </select>
            </div>

            <div>
              <label className="text-xs font-bold text-white block mb-1">Observações do Cliente</label>
              <input
                type="text"
                placeholder="Ex: gosta de cerveja bem gelada, degradê na zero"
                value={notes}
                onChange={(e) => setNotes(e.target.value)}
                className="w-full bg-[#08090C] border border-[#202532] focus:border-white rounded-xl p-2.5 text-white text-xs outline-none"
              />
            </div>
          </div>

          {/* Painel do Total da Comanda e CTA */}
          <div className="p-4 rounded-2xl bg-[#08090C] border border-[#202532] flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <span className="text-[10px] text-slate-400 uppercase font-bold tracking-wider block">Total Geral da Comanda</span>
              <div className="text-2xl font-extrabold font-heading text-white">
                {formatBRL(totalAmount)}
              </div>
              <div className="text-[10px] text-slate-400 mt-0.5">
                Cortes: {formatBRL(servicesTotal)} + Frigobar: {formatBRL(productsTotal)}
              </div>
            </div>

            <div className="flex items-center gap-2.5 w-full sm:w-auto">
              <button
                type="button"
                onClick={onClose}
                className="flex-1 sm:flex-initial px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white"
              >
                Cancelar
              </button>
              <button
                type="submit"
                className="flex-1 sm:flex-initial bg-white hover:bg-slate-100 text-black font-extrabold px-6 py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 shadow-xl transition-all active:scale-95"
              >
                <Icon name="check" size={16} />
                <span>{editingAppointment ? 'Salvar Alterações na Comanda' : 'Salvar & Faturar Atendimento'}</span>
              </button>
            </div>
          </div>

        </form>
      );
    }

                value={price}
                onChange={(e) => setPrice(e.target.value)}
                className="w-full bg-[#08090C] border border-[#202532] focus:border-white rounded-xl p-2.5 text-white font-mono text-xs outline-none"
                required
              />
            </div>

            <div className="space-y-1.5">
              <label className="text-xs font-bold text-white block">Duração (minutos)</label>
              <input
                type="number"
                step="5"
                value={durationMinutes}
                onChange={(e) => setDurationMinutes(e.target.value)}
                className="w-full bg-[#08090C] border border-[#202532] focus:border-white rounded-xl p-2.5 text-white font-mono text-xs outline-none"
                required
              />
            </div>
          </div>

          <div className="space-y-1.5">
            <label className="text-xs font-bold text-white block">Categoria</label>
            <select
              value={category}
              onChange={(e) => setCategory(e.target.value)}
              className="w-full bg-[#08090C] border border-[#202532] focus:border-white rounded-xl p-2.5 text-white text-xs outline-none"
            >
              <option value="corte">Corte / Acabamento</option>
              <option value="barba">Barba / Terapia</option>
              <option value="combo">Combo Completo</option>
              <option value="quimica">Química / Pigmentação</option>
              <option value="outro">Outro</option>
            </select>
          </div>

          <div className="flex items-center justify-end gap-2.5 pt-3 border-t border-[#202532]">
            <button type="button" onClick={onClose} className="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-white">
              Cancelar
            </button>
            <button type="submit" className="bg-white hover:bg-slate-100 text-black font-extrabold px-5 py-2 rounded-xl text-xs">
              {editingService ? 'Salvar Serviço' : 'Cadastrar Serviço'}
            </button>
          </div>
        </form>
      );
    }

    // =========================================================================
    // MODAL DE CADASTRO DE CUSTO OPERACIONAL
    // =========================================================================
    function ExpenseFormModal({ onSave, onClose }) {
      const [description, setDescription] = useState('');
      const [amount, setAmount] = useState(100);
      const [category, setCategory] = useState('imovel');
      const [type, setType] = useState('fixo');
      const [recurrence, setRecurrence] = useState('mensal');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!description.trim()) return;
        onSave({
          description: description.trim(),
          amount: parseFloat(amount) || 0,
          category,
          type,
          recurrence,
          isPaid: true
        });
      };

      return (
        <form onSubmit={handleSubmit} className="p-5 space-y-4 text-xs text-slate-200">
          <div className="space-y-1.5">
            <label className="text-xs font-bold text-white block">Descrição da Despesa</label>
            <input
              type="text"
              placeholder="Ex: Conta de Energia Elétrica"
              value={description}
              onChange={(e) => setDescription(e.target.value)}
              className="w-full bg-[#08090C] border border-[#202532] focus:border-white rounded-xl p-2.5 text-white text-xs outline-none"
              required
            />
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div className="space-y-1.5">
              <label className="text-xs font-bold text-white block">Valor (R$)</label>
              <input
                type="number"
                step="0.1"
                value={amount}
                onChange={(e) => setAmount(e.target.value)}
                className="w-full bg-[#08090C] border border-[#202532] focus:border-white rounded-xl p-2.5 text-white font-mono text-xs outline-none"
                required
              />
            </div>

            <div className="space-y-1.5">
              <label className="text-xs font-bold text-white block">Categoria</label>
              <select
                value={category}
                onChange={(e) => setCategory(e.target.value)}
                className="w-full bg-[#08090C] border border-[#202532] focus:border-white rounded-xl p-2.5 text-white text-xs outline-none"
              >
                <option value="imovel">Aluguel / Imóvel</option>
                <option value="energia">Energia Elétrica</option>
                <option value="internet">Internet / Telefone</option>
                <option value="agua">Água / Saneamento</option>
                <option value="servicos">Contador / Taxas</option>
                <option value="descartaveis">Lâminas / Descartáveis</option>
                <option value="produtos">Pomadas / Shampoos Bancada</option>
                <option value="cafe_cortesia">Café & Balas Cortesia</option>
                <option value="limpeza">Material de Limpeza</option>
                <option value="outro">Outro</option>
              </select>
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div className="space-y-1.5">
              <label className="text-xs font-bold text-white block">Tipo</label>
              <select
                value={type}
                onChange={(e) => setType(e.target.value)}
                className="w-full bg-[#08090C] border border-[#202532] focus:border-white rounded-xl p-2.5 text-white text-xs outline-none"
              >
                <option value="fixo">Custo Fixo (estrutural)</option>
                <option value="variavel">Custo Variável (consumo)</option>
              </select>
            </div>

            <div className="space-y-1.5">
              <label className="text-xs font-bold text-white block">Recorrência</label>
              <select
                value={recurrence}
                onChange={(e) => setRecurrence(e.target.value)}
                className="w-full bg-[#08090C] border border-[#202532] focus:border-white rounded-xl p-2.5 text-white text-xs outline-none"
              >
                <option value="mensal">Mensal (repete todo mês)</option>
                <option value="unico">Despesa Única (apenas este mês)</option>
                <option value="diario">Diário (lançamento de hoje)</option>
              </select>
            </div>
          </div>

          <div className="p-3 rounded-xl bg-white/5 border border-white/10 text-[11px] leading-relaxed text-slate-300">
            {type === 'variavel' ? (
              <p>
                💡 <strong className="text-amber-300">Dica sobre Custo Variável:</strong> Se for uma compra ou reposição pontual que não deve se repetir nos próximos meses, selecione <strong className="text-white">"Despesa Única"</strong> (ao virar o mês, ela não entra no cálculo do próximo mês). Se for um gasto que você tem mensalmente (ex: lâminas e café regulares), selecione <strong className="text-white">"Mensal"</strong>.
              </p>
            ) : (
              <p>
                🏢 <strong className="text-white">Custo Fixo Estrutural:</strong> Aluguel, contas essenciais e taxas fixas mensais da barbearia que existem independente do movimento.
              </p>
            )}
          </div>

          <div className="flex items-center justify-end gap-2.5 pt-3 border-t border-[#202532]">
            <button type="button" onClick={onClose} className="px-4 py-2 text-xs font-semibold text-slate-400 hover:text-white">
              Cancelar
            </button>
            <button type="submit" className="bg-white hover:bg-slate-100 text-black font-extrabold px-5 py-2 rounded-xl text-xs">
              Cadastrar Custo
            </button>
          </div>
        </form>
      );
    }

    // =========================================================================
    // INICIALIZAÇÃO DA APLICAÇÃO REACT NO BROWSER
    // =========================================================================
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <ErrorBoundary>
        <BarbershopApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
